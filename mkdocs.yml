# Вики NightWorld для игроков. Сборка: mkdocs build  ·  предпросмотр: mkdocs serve
site_name: NightWorld — вики
site_description: Всё, что нужно игроку сервера NightWorld (mc.nightworld.ovh)
# Адрес, где будет висеть сайт. Свой домен — оставьте так и положите docs/CNAME (см. README.md).
# Без домена на GitHub Pages: https://<логин>.github.io/<репозиторий>/
site_url: https://zafiks.github.io/wiki/
copyright: NightWorld · mc.nightworld.ovh

theme:
  name: material
  language: ru
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/filter.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      # якоря заголовков по-русски (#привязка-аккаунта), а не пустые
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/yp9KT8t6zQ
      name: Discord
    - icon: fontawesome/brands/telegram
      link: https://t.me/nightworld_ovh
      name: Telegram
    - icon: material/web
      link: https://nightworld.ovh
      name: Сайт

nav:
  - Главная: index.md
  - Начало:
      - Как зайти на сервер: start.md
      - Моды: mods.md
      - Правила: rules.md
      - Команды: commands.md
      - Вопросы и ответы: faq.md
  - Игра:
      - Чат и общение: chat.md
      - Приваты и защита: privat.md
      - Очки лояльности: loyalty.md
      - Особенности выживания: survival.md
      - Креатив-мир: creative.md
      - Творчество: creativity.md
  - Питомцы и вещи:
      - Питомцы: pets.md
      - Гардероб: wardrobe.md
      - Предметы по названию: renames.md
  - Люди:
      - Объединения: groups.md
      - Войны объединений: wars.md
      - Брак, семья, наставники: family.md
  - Развлечения:
      - Казино: casino.md
      - Ларцы: larec.md
      - Топы и награды: tops.md
  - Донат: donate.md
