# Публикация вики на GitHub Pages: каждый push в main собирает сайт и выкладывает его.
# В репозитории: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Файл должен лежать в КОРНЕ репозитория: .github/workflows/deploy.yml.
# Сама вики может быть и в корне, и в папке wiki/ — сборка найдёт mkdocs.yml сама.
name: Вики на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка
        run: |
          if [ -f wiki/mkdocs.yml ]; then cd wiki; fi
          pip install -r requirements.txt
          mkdocs build --strict -d "$GITHUB_WORKSPACE/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
